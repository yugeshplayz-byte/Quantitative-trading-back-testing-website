# Render Blueprint: New -> Blueprint -> select this repo.
# ONE web service (Docker) serves the website AND the API from a single URL, plus a Postgres database.
# Render will ask you for APP_PASSWORD (the password for the whole site) - set something long.
databases:
  - name: quant-db
    plan: free
    databaseName: quant
    user: quant

services:
  - type: web
    name: quant-backtester
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quant-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: APP_USERNAME
        value: admin
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_CUSTOM_CODE
        value: "false"
